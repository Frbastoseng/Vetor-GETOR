name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: testes unitarios (CPU, sem modelo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias (torch CPU)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"
      - run: python -m pytest -q -m "not model"

  model:
    name: testes com SmolLM2-135M real (CPU)
    runs-on: ubuntu-latest
    needs: unit
    env:
      VETOR_DEVICE: cpu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-smollm2-135m-12fd25f-wikitext2
      - name: Instalar dependencias (torch CPU)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"
      - run: python -m pytest -q
